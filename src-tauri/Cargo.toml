[package]
name = "zte-traffic-alert"
version = "0.2.0"
description = "ZTE pocket WiFi traffic monitor and auto-disconnect desktop app"
authors = ["Staticmaple"]
edition = "2021"

[lib]
name = "zte_traffic_alert_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
chrono = { version = "0.4", features = ["serde"] }
dirs = "5"
reqwest = { version = "0.12", features = ["blocking", "json", "cookies"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-autostart = "2"
tauri-plugin-opener = "2"
thiserror = "1"
urlencoding = "2"
